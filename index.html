<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <pre id="draft"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const draft = document.querySelector("#draft");
    const topics = new Map([["delivery", "Доставка"], ["pricing", "Стоимость"], ["other", "Другое"]]);
    let revision = 0;

    message.addEventListener("input", () => {
      revision++;
      status.textContent = "";
      draft.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const current = ++revision;
      const text = message.value.trim();
      draft.textContent = "";
      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (current !== revision) return;
        if (reply.ok && data?.status === "ready" && topics.has(data.topic)
            && typeof data.draft === "string" && data.draft.trim()) {
          status.textContent = "Тема: " + topics.get(data.topic);
          draft.textContent = data.draft;
          return;
        }
      } catch {
        if (current !== revision) return;
      }
      status.textContent = "Нужен ручной разбор. Проверьте исходную заявку и подготовьте ответ самостоятельно.";
    });
  </script>
</body>
</html>
